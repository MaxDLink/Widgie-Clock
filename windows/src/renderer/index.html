<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Widgie Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="widget" class="widget locked">
      <div class="clock">
        <div class="rim"></div>
        <div class="face">
          <div class="ticks" id="ticks"></div>
          <div class="num n12">12</div>
          <div class="num n3">3</div>
          <div class="num n6">6</div>
          <div class="num n9">9</div>
          <div class="hand hour" id="hour"></div>
          <div class="hand minute" id="minute"></div>
          <div class="hand second" id="second"></div>
          <div class="pin"></div>
          <div class="pin-inner"></div>
        </div>
      </div>
      <div class="status">
        <span id="time">--:--</span>
        <span class="sep">·</span>
        <span id="temp">—</span>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
